name: CD

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - if: hashFiles('wrangler.jsonc') != ''
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://hetzner.thegoated.dev
          NEXT_PUBLIC_POSTHOG_HOST: /hcr-relay
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_sfsrD8YaF3XoMc9KjANjtyY3NXCm2BydfZJRELvqyRoH
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEc2-Ej1LpIwYxsK
